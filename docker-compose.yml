services:
  backend:
    build: ./backend
    environment:
      APP_ENV: development
      CORS_ORIGINS: http://localhost:3000
      DEMO_MODE: "true"
      SPEECH_PROVIDER: local
      VOSK_MODEL_PATH: /models/vosk-model-small-hi-0.22
      FFMPEG_BINARY: ffmpeg
      ESPEAK_NG_BINARY: espeak-ng
    volumes:
      - ${VOSK_MODEL_HOST_PATH:-./models/vosk-model-small-hi-0.22}:/models/vosk-model-small-hi-0.22:ro
    ports:
      - "8000:8000"

  frontend:
    environment:
      APP_ENV: development
      BACKEND_API_URL: http://backend:8000
      SAATHI_LOCAL_RATE_LIMITER_ENABLED: "true"
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"
