services:
  ollama:
    image: ollama/ollama:0.34.0
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  ollama-init:
    image: ollama/ollama:0.34.0
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/ollama"]
    command: ["pull", "qwen2.5:7b"]
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama-data:/root/.ollama
    restart: "no"

  frontend:
    environment:
      APP_ENV: development
      SAATHI_LOCAL_RATE_LIMITER_ENABLED: "true"
      SAATHI_API_AUTH_TOKEN: ${SAATHI_API_AUTH_TOKEN:?Set SAATHI_API_AUTH_TOKEN in your local .env file}

  backend:
    environment:
      APP_ENV: development
      DEMO_MODE: "false"
      LLM_PROVIDER: ollama
      LLM_MODEL: qwen2.5:7b
      API_AUTH_TOKEN: ${SAATHI_API_AUTH_TOKEN:?Set SAATHI_API_AUTH_TOKEN in your local .env file}
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ollama-init:
        condition: service_completed_successfully

volumes:
  ollama-data:
