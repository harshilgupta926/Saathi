name: Saathi CI

concurrency:
  group: saathi-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Smoke-test the running local API
        shell: bash
        run: |
          set -euo pipefail
          APP_ENV=development DEMO_MODE=true python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/saathi-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/saathi-api.log
            exit 1
          fi
          python ../scripts/local_smoke.py --api-only

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: node --test tests/*.test.mjs
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Smoke-test the built local dashboard
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/saathi-frontend.log 2>&1 &
          frontend_pid=$!
          trap 'kill "$frontend_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/dashboard >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/saathi-frontend.log
            exit 1
          fi
          python ../scripts/local_smoke.py --frontend-only

  streamlit-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r streamlit_app/requirements.txt
      - run: python -m py_compile streamlit_app/app.py

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pip-audit
      - run: pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - working-directory: frontend
        run: npm ci
      - name: Report full frontend dependency advisories
        working-directory: frontend
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node - "$RUNNER_TEMP/npm-audit.json" <<'NODE'
          const fs = require("node:fs");
          let report;
          try {
            report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          } catch {
            console.log("Full frontend audit report unavailable; production-only audit still runs below.");
            process.exit(0);
          }
          const counts = report.metadata?.vulnerabilities ?? {};
          console.log("Full dependency-tree audit counts:", JSON.stringify(counts));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            const advisories = (item.via ?? []).map((via) =>
              typeof via === "string" ? via : (via.title ?? via.name ?? "advisory")
            );
            console.log(JSON.stringify({
              package: name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              advisories,
            }));
          }
          NODE
      # Runtime dependencies remain a strict release gate; full-tree advisories above are reported for triage.
      - working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate base and local-AI Compose configuration
        run: docker compose -f docker-compose.yml -f docker-compose.local-ai.yml config --quiet
      - name: Build production API image (retry transient registry failures)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker build --pull --file Dockerfile --tag saathi-api:ci .; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Docker build failed on attempt $attempt; waiting before retry."
              sleep $((attempt * 15))
            fi
          done
          echo "Docker image build failed after 3 attempts."
          exit 1
      - name: Verify container entrypoint and image metadata
        run: docker image inspect saathi-api:ci --format '{{.Config.Entrypoint}} {{.Config.Cmd}}'
